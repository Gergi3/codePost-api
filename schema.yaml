          nullable: true
          description: The original comment this template was created from. Null if
            manually created or source was deleted.
        cellId:
          type: string
          nullable: true
          description: Optional notebook cell ID. If set, template only shows for
            this cell.
          maxLength: 36
    PatchedCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: The name of the course.
          maxLength: 36
        period:
          type: string
          description: A string describing the period (e.g. F2019, T32019, etc.
          maxLength: 32
        assignments:
          type: array
          items:
            type: integer
          readOnly: true
        sections:
          type: array
          items:
            type: integer
          readOnly: true
        sendReleasedSubmissionsToBack:
          type: boolean
          description: A boolean field. If True, submissions that are claimed and
            subsequently released will be added to the back of the grading queue.
        showStudentsStatistics:
          type: boolean
          description: A boolean field. If True, students will be able to view basic
            grade statistics for released assignments.
        timezone:
          type: string
          description: Timezone in which course operates.
          maxLength: 32
        emailNewUsers:
          type: boolean
          description: A boolean field. If True, when emails are added to a course
            roster that do not correspond to existing codePost users, those emails
            will be sent an email notifying that they have been added to a course
            and providing a link to register their (new) accounts.
        anonymousGradingDefault:
          type: boolean
          description: A boolean field. If True, new assignments will have anonymous
            grading mode enabled by default.
        allowGradersToEditRubric:
          type: boolean
          description: A boolean field. If True, graders will be allowed to add and
            update unlinked rubric comments.
        gradersCanGradeQuizzes:
