    ValidateNewAdminUserRequest:
      type: object
      properties:
        organization:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - organization
    ValidateNewAdminUserResponse:
      type: object
      properties:
        success:
          type: boolean
        action_id:
          type: string
        is_new_org:
          type: boolean
        pending:
          type: boolean
      required:
      - action_id
      - success
    ValidateOTTRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    VariantBehavioralStats:
      type: object
      description: Behavioral stats for a single variant.
      properties:
        total:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        pending:
          type: integer
        acceptanceRate:
          type: number
          format: double
          nullable: true
        rejectionRate:
          type: number
          format: double
          nullable: true
        editRate:
          type: number
          format: double
          nullable: true
        avgTimeToDecideSeconds:
          type: number
          format: double
          nullable: true
        distinctAssignments:
          type: integer
      required:
