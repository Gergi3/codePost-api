  /assignmentDataSets/{id}/splitIntoVariants/:
    post:
      operationId: assignmentDataSets_splitIntoVariantsCreate
      description: |-
        Split this dataset's file into disjoint row-chunks, one per generated variant,
        forming a per-student pool (see core.services.dataset_split). The chunk count is
        driven by rowsPerChunk, not current enrollment, so the pool stays stable as
        students enroll or drop.

        Pass replace=true to regenerate in place: prior auto-generated variants of this
        master are deleted first (which resets every student's variant assignment) instead
        of erroring on the name collision.

        POST /assignmentDataSets/{id}/splitIntoVariants/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this assignment data set.
        required: true
      tags:
      - assignmentDataSets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rowsPerChunk:
                  type: integer
                  minimum: 1
                hasHeader:
                  type: boolean
                replace:
                  type: boolean
              required:
              - rowsPerChunk
      security:
      - courseKeyAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentDataSet'
          description: ''
