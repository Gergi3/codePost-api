components:
  schemas:
    AIModel:
      type: object
      description: A single AI model entry.
      properties:
        id:
          type: string
          description: Model identifier to pass to the provider API
        name:
          type: string
          description: Human-readable display name
        isDefault:
          type: boolean
          default: false
          description: Whether this is the default model for the provider
      required:
      - id
      - name
    AIProviderModels:
      type: object
      description: Models available for a single provider.
      properties:
        provider:
          type: string
          description: Provider identifier (e.g. 'gemini', 'openai')
        models:
          type: array
          items:
            $ref: '#/components/schemas/AIModel'
          description: Curated list of known models for this provider
        liveModels:
          type: array
          items:
            $ref: '#/components/schemas/AIModel'
          description: Models fetched from the provider's API (only included when
            credentials are supplied)
        liveError:
          type: string
          nullable: true
          description: Error message if querying the provider failed
      required:
      - models
      - provider
    AIProviderModelsList:
      type: object
      description: Response wrapper for the AI models endpoint.
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AIProviderModels'
          description: List of providers with their models
      required:
      - providers
    AIProviderTestRequest:
      type: object
      description: Optional request body for the AI provider connection test.
      properties:
        prompt:
          type: string
          description: Optional custom prompt to send instead of the default connectivity
            prompt
          maxLength: 500
        model:
          type: string
          description: Optional model id to test against, overriding the saved model
            without saving it
          maxLength: 64
    AIProviderTestResult:
      type: object
      description: Result of a live AI provider connection test.
      properties:
        success:
          type: boolean
          description: Whether the provider answered the test prompt
        provider:
          type: string
          description: Provider identifier the test ran against
        model:
          type: string
          description: Model the test ran against
        reportedModel:
          type: string
          nullable: true
          description: Model id the provider reported back (may differ from the requested
            model, e.g. a gateway-routed or versioned model)
        latencyMs:
          type: number
          format: double
          nullable: true
          description: Round-trip time of the test request in milliseconds
        requestSystemPrompt:
          type: string
          nullable: true
          description: System prompt sent to the provider (null if no request was
            attempted)
        requestUserPrompt:
          type: string
          nullable: true
          description: User prompt sent to the provider (null if no request was attempted)
        response:
          type: string
          nullable: true
          description: The model's reply (up to 2000 characters)
        error:
          type: string
          nullable: true
          description: Friendly error message
        errorDetail:
          type: string
          nullable: true
          description: Raw exception detail for debugging
      required:
      - model
      - provider
      - success
    AIUsageBreakdown:
      type: object
      description: Usage breakdown by a dimension (course, assignment, provider, model).
      properties:
        id:
          type: integer
          nullable: true
          description: ID of the entity (course or assignment)
        name:
          type: string
          description: Name/label for this breakdown item
        totalTokens:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        estimatedCost:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        projectedCost:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Cost of this item's usage at the currently configured token
            rates
        requestCount:
          type: integer
      required:
      - estimatedCost
      - id
      - inputTokens
      - name
      - outputTokens
      - projectedCost
      - requestCount
      - totalTokens
    AIUsageBucket:
      type: object
      description: A single time bucket in usage aggregation.
      properties:
        period:
          type: string
          format: date-time
          description: Start of the time bucket
        totalTokens:
          type: integer
          description: Total tokens used in this bucket
        inputTokens:
          type: integer
          description: Total input tokens in this bucket
        outputTokens:
          type: integer
          description: Total output tokens in this bucket
        estimatedCost:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Total estimated cost in USD
        projectedCost:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Cost of this bucket's usage at the currently configured token
            rates
        requestCount:
          type: integer
          description: Number of API calls in this bucket
      required:
      - estimatedCost
      - inputTokens
      - outputTokens
      - period
      - projectedCost
      - requestCount
      - totalTokens
    AIUsageSummary:
      type: object
      description: Aggregated usage summary with time-series data and breakdowns.
      properties:
        totalTokens:
          type: integer
          description: Grand total tokens in the range
        inputTokens:
          type: integer
          description: Grand total input tokens
        outputTokens:
          type: integer
          description: Grand total output tokens
        cachedTokens:
          type: integer
          description: Grand total cached input tokens
        estimatedCost:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        projectedCost:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Total cost of the range's usage at the currently configured
            token rates
        requestCount:
          type: integer
          description: Total number of requests
        timeSeries:
          type: array
          items:
            $ref: '#/components/schemas/AIUsageBucket'
          description: Usage data bucketed by time
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/AIUsageBreakdown'
          description: Usage breakdown by dimension
        modelBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/AIUsageBreakdown'
          description: Usage breakdown by AI model
        featureBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/AIUsageBreakdown'
          description: Usage breakdown by AI feature (request type)
        granularity:
          $ref: '#/components/schemas/GranularityEnum'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
      required:
      - breakdown
      - cachedTokens
      - endDate
      - estimatedCost
      - granularity
      - inputTokens
      - outputTokens
      - projectedCost
      - requestCount
      - startDate
      - timeSeries
      - totalTokens
    AcceptSuggestionRequest:
      type: object
      properties:
        bankId:
          type: integer
    ActivateCipResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
    AgentAliasLookupResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/AgentAliasMatch'
      required:
      - matches
    AgentAliasMatch:
      type: object
      properties:
        alias:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        active:
          type: boolean
      required:
      - active
      - alias
      - email
      - username
    AggregationModeEnum:
      enum:
      - all
      - any
      - percentage
      - points_weighted
      type: string
      description: |-
        * `all` - All linked tests must pass
        * `any` - At least one linked test must pass
        * `percentage` - Percentage of linked tests that pass
        * `points_weighted` - Weighted by test point values
    AiCoursePolicyEnum:
      enum:
      - all
      - selected
      - none
      type: string
      description: |-
        * `all` - All courses
        * `selected` - Selected courses only
        * `none` - Disabled
    AiProviderEnum:
      enum:
      - gemini
      - openai
      - ollama
      - portkey
      - custom
      type: string
      description: |-
        * `gemini` - Google Gemini
        * `openai` - OpenAI
        * `ollama` - Ollama (Self-hosted)
        * `portkey` - Portkey (Self-hosted)
        * `custom` - Custom Provider
    Assignment:
      type: object
      description: Assignment Serializer from which all other Assignment Serializer
        subclasses inherit from
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: The name of the assignment.
          maxLength: 32
        state:
          allOf:
          - $ref: '#/components/schemas/AssignmentStateEnum'
          description: |-
            Lifecycle state: draft -> visible -> preview -> published -> closed -> archived. Students see visible through closed, download files from preview onward, and submit only while published.

            * `draft` - Draft
            * `visible` - Visible
            * `preview` - Preview
            * `published` - Published
            * `closed` - Closed
            * `archived` - Archived
        effectiveState:
          allOf:
          - $ref: '#/components/schemas/AssignmentStateEnum'
          readOnly: true
        publishedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the assignment last entered the published state. Cleared
            if it moves back to a pre-published state (not on close/archive).
        publishAt:
          type: string
          format: date-time
          nullable: true
          description: Visible/Preview assignments auto-publish at this time (checked
            every few minutes).
        scheduledPublishRanAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the scheduled publishAt run last fired (one-shot stamp).
            Moving publishAt past this re-arms the run.
        isReleased:
          type: boolean
          readOnly: true
        feedbackStatus:
          allOf:
          - $ref: '#/components/schemas/AssignmentFeedbackStatusEnum'
          description: |-
            How grading becomes visible to students: hidden (nothing), live (as it's written), per_student (each student once their submission is finalized), released (finalized submissions, globally).

            * `hidden` - Hidden
            * `live` - Live
            * `per_student` - Per student
            * `released` - Released
        releaseFeedbackAt:
          type: string
          format: date-time
          nullable: true
          description: Hidden/per-student assignments auto-release feedback at this
            time (checked every few minutes).
        scheduledFeedbackReleaseRanAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the scheduled releaseFeedbackAt run last fired (one-shot
            stamp). Moving releaseFeedbackAt past this re-arms the run.
        feedbackReleased:
          type: boolean
          readOnly: true
        course:
          type: integer
          description: The related course_id.
        rubricCategories:
          type: array
          items:
            type: integer
          readOnly: true
        allowStudentUpload:
          type: boolean
          description: A boolean field. If true, students will be allowed to upload
            submissions until the upload due date.
        allowStudentUploadWithPartners:
          type: boolean
          description: A boolean field. If true, students will be allowed to invite
            partners to their submission.
        uploadDueDate:
          type: string
          format: date-time
          nullable: true
          description: The date after which students are not allowed to upload submissions.
            Only useful if allowStudentUpload is set to True.
        maxLateDays:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: An integer representing the maximum number of late days to
            continue to accept submissions for this assignment.
        liveFeedbackMode:
          type: boolean
          readOnly: true
        allowLateUploads:
          type: boolean
          description: A boolean field. If True and an uploadDueDate is set, students
            will still be able to submit after a deadline has passed.
        environment:
          type: integer
          readOnly: true
        files:
          type: array
          items:
            type: integer
          readOnly: true
        fileTemplates:
          type: array
          items:
            type: integer
          readOnly: true
        maxStudentTestRuns:
          type: integer
          nullable: true
          readOnly: true
        sortKey:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Optional integer to specify the order of a Course's Assignments.
        explanation:
          type: string
          description: The explanation of an assignment, visible to students.
        isVisible:
          type: boolean
          readOnly: true
        hideFrom:
          type: array
          items:
            type: integer
            title: HideFrom
          description: Sections from which to hide this assignment.
        nudgeMode:
          type: boolean
          readOnly: true
        lateDeductions:
          default: []
        studentsCanSeeGraders:
          type: boolean
          nullable: true
          description: If set, overrides course setting. If True, students can see
            graders for this assignment.
        dataSets:
          type: array
          items:
            type: integer
          readOnly: true
        points:
          type: number
          format: double
          maximum: 1000
          minimum: 0
          exclusiveMaximum: true
          description: Total points for the assignment.
        hideGrades:
          type: boolean
          description: A boolean field. If True, numeric grades are masked from students
            in any revealing feedbackStatus — they still see comments and the rubric.
        anonymousGrading:
          type: boolean
          description: A boolean field. If 'True', graders will not have access to
            the students field of submission objects, unless they have elevated privileges.
        hideGradersFromStudents:
          type: boolean
          description: A boolean field. If True, the graders of a submission will
            be hidden from students.
        commentFeedback:
          type: boolean
          description: A boolean field. If True, students can provide feedback on
            rubric comments.
        additiveGrading:
          type: boolean
          description: A boolean field. If true, grades begin at 0 (instead of assignment.points)
        allowRegradeRequests:
          type: boolean
          description: A boolean field. If True, students will be allowed to submit
            questions and regrade requests after their submission has been graded.
        regradeInstructions:
          type: string
          description: Instructions (in Markdown) to show students when they submit
            regrade requests.
        regradeDeadline:
          type: string
          format: date-time
          nullable: true
          description: The date after which students are not allowed submit a regrade
            request.
        forcedRubricMode:
          type: boolean
          description: A boolean field. If true, graders will be required to link
            a rubric comment on all comments.
        templateMode:
          type: boolean
          description: A boolean field. If true, admins will be able upload template
            code files. Those template files will be used to de-emphasize provided
            versus student-written code in submissions.
        collaborativeRubricMode:
          type: boolean
          description: A boolean field. If true, admins and graders can edit the assignment
            rubric inline in the code console.
        gradersCanEditSubmissions:
          type: boolean
          description: A boolean field. If True, graders will be allowed to edit student
            submissions (e.g. for testing fixes).
        testCategories:
          type: array
          items:
            type: integer
          readOnly: true
        showFrequentlyUsedRubricComments:
          type: boolean
          description: A boolean field. If true, an assignment's 10 most frequently
            used rubric comments will be shown within the code console.
        ai_system_prompt:
          type: string
          description: 'System prompt for AI comment generation. Placeholders: {assignment_name},
            {file_content}, {selected_content}, {rubric_context}, {grader_draft}'
        ai_summary_prompt:
          type: string
          description: 'Per-assignment override of the submission-summary system prompt.
            Placeholders: {assignment_name}, {assignment_description}, {test_results},
            {rubric}, {description_comparison}. Blank uses the global default.'
        ai_description:
          type: string
          description: AI-generated description of the assignment used as context
            for AI grading features. Editable by course admins, visible to graders.
            Not shown to students.
        ai_description_locked:
          type: boolean
          description: When True, prevents automatic regeneration of ai_description
            from new submissions.
        runFilesOnSubmit:
          type: boolean
          description: If True, submission files will be automatically executed and
            cached when a student submits.
        runTestsOnSubmit:
          type: boolean
          description: If True, autograder tests will automatically run when a student
            submits.
        testsAffectGrade:
          type: boolean
          description: If True, the results of autograder tests will be included in
            the submission grade calculation.
      required:
      - course
      - dataSets
      - effectiveState
      - environment
      - feedbackReleased
      - fileTemplates
      - files
      - id
      - isReleased
      - isVisible
      - liveFeedbackMode
      - maxStudentTestRuns
      - name
      - nudgeMode
      - points
      - publishedAt
      - rubricCategories
      - scheduledFeedbackReleaseRanAt
      - scheduledPublishRanAt
      - testCategories
    AssignmentAnalyticsAttemptDistribution:
