          description: ''
  /generatedQuestionSets/{id}/regenerate/:
    post:
      operationId: generatedQuestionSets_regenerateCreate
      description: Discard this set's questions and generate new ones from the student's
        submission. An approved set becomes un-published until re-approved. Blocked
        once the student has attempted the quiz — their responses reference these
        questions (the grading answer key).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this generated question set.
        required: true
