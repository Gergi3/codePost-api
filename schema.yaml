              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingAgentAction'
          description: ''
  /courses/{id}/pendingAgentActions/{actionId}/approve/:
    post:
      operationId: courses_pendingAgentActionsApproveCreate
      description: |-
        Approve a pending agent action — the agent's next retry executes it.

        The conditional update makes approve-vs-deny and double-click races
        resolve deterministically: whoever flips the row first wins, everyone
        else gets 409.
      parameters:
      - in: path
        name: actionId
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - courseKeyAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /courses/{id}/pendingAgentActions/{actionId}/deny/:
    post:
      operationId: courses_pendingAgentActionsDenyCreate
      description: |-
        Deny a pending agent action.

        The denial sticks until the request expires: the agent's retries get a
        clear "denied — stop asking" error instead of minting a fresh request.
      parameters:
      - in: path
        name: actionId
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - courseKeyAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
