      - lockdownVerified
      - oneQuestionAtATime
      - quiz
      - requireSebBrowser
      - responses
      - serverNow
      - showResponses
      - student
      - title
    StaffQuizResponse:
      type: object
      description: |-
        A response as staff (grading/review) sees it: adds the grader-only answer key, the
        sandbox code-execution result, and the grading provenance (gradedBy/gradedAt). NEVER used
        for student-facing payloads — none of these fields are in the student's Meta.fields, so
        StudentQuizResponseSerializer is structurally incapable of exposing them.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          allOf:
          - $ref: '#/components/schemas/StudentQuestion'
          readOnly: true
        sortKey:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Presentation order within the attempt (randomized when shuffleQuestions).
        points:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Points this question is worth in this attempt (snapshot of
            override/base).
        answerText:
          type: string
          description: Typed answer for short-answer/numerical/essay/code questions.
        selectedChoices:
          type: array
          items:
            type: integer
          readOnly: true
        pointsEarned:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Points awarded after grading. Null until graded.
        isCorrect:
          type: boolean
          nullable: true
          description: Whether the auto-graded answer was correct. Null for manual/ungraded.
        needsManualGrading:
          type: boolean
          description: True for essay/code responses awaiting manual grading.
        graderFeedback:
          type: string
          description: Optional feedback from the grader on a manually graded response.
        referenceSolution:
          type: string
          nullable: true
          readOnly: true
        codeExecution:
          readOnly: true
        gradedBy:
          type: string
          format: email
          title: Email address
          readOnly: true
        gradedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - codeExecution
      - gradedAt
      - gradedBy
