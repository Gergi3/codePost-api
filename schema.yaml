  /courses/{id}/assignments/:
    get:
      operationId: courses_assignmentsList
      description: |-
        Every assignment in the course the caller may see, each serialized exactly as
        GET /assignments/{id}/ would serialize it for this caller. Replaces the client-side
        per-id fan-out (the course detail returns ids only, and list endpoints are blocked).

        The visible set mirrors AssignmentPermissions.has_object_permission, NOT the course
        serializer's id list: staff and superusers see everything; students see
        STUDENT_VISIBLE_STATES minus section-hidden assignments; anyone else who can read
        the course (org staff of the org who is not a member) gets an empty list, because
        every per-id retrieve 403s for them today.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      tags:
      - courses
      security:
      - courseKeyAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
          description: ''
  /courses/{id}/auditLog/:
    get:
      operationId: courses_auditLogList
      description: Return paginated audit events for a course, filterable by student,
        assignment, event type, and date range.
      parameters:
      - in: query
        name: assignment
        schema:
          type: integer
        description: Filter by assignment ID
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: Filter events after this datetime
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
        description: Filter events before this datetime
      - in: query
        name: event_type
        schema:
          type: string
        description: Filter by event type
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: student
        schema:
          type: string
        description: Filter by student email
      tags:
      - courses
      security:
      - courseKeyAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseAuditEventList'
          description: ''
