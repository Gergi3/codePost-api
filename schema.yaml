          description: The text on the comment
        pointDelta:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: The points deducted. A negative number represents a bonus.
        startChar:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The starting character offset of the comment. For code/markdown
            files: 0-indexed character position within the start line. For PDF text-selection
            comments: character offset in the page''s text layer. For PDF region comments:
            values >= 1,000,000 encode a bounding box as MARKER + leftPct*101 + topPct
            (percentages 0-100 of page dimensions). For Jupyter notebooks (.ipynb):
            always 0 (comments target entire cells).'
        endChar:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The ending character offset of the comment. For code/markdown
            files: 0-indexed character position within the end line. For PDF text-selection
            comments: character offset in the page''s text layer. For PDF region comments:
            values >= 1,000,000 encode a bounding box as MARKER + rightPct*101 + bottomPct
            (percentages 0-100 of page dimensions). For Jupyter notebooks (.ipynb):
            always 0 (comments target entire cells).'
        startLine:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The line or position where the comment begins. For code/markdown
            files: 0-indexed line number. For PDF files: 1-based page number. For
            Jupyter notebooks (.ipynb): 0-based cell index.'
        endLine:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The line or position where the comment ends. For code/markdown
            files: 0-indexed line number. For PDF files: 1-based page number (usually
            same as startLine). For Jupyter notebooks (.ipynb): 0-based cell index
            (usually same as startLine).'
        file:
          type: integer
          description: The related file_id.
        rubricComment:
          type: integer
          nullable: true
          description: The related rubricComment_id. Null if no rubric comment linked.
        author:
          type: string
          format: email
          title: Email address
        feedback:
          type: integer
          readOnly: true
          description: 'Student feedback on this comment. Valid values: -1 (negative),
            0 (none), 1 (positive). Only applicable when rubricComment is set.'
        color:
          type: string
          nullable: true
          readOnly: true
        tags:
          type: array
          items:
            type: string
            description: The tag label.
            nullable: true
