  /courses/{id}/agentAliases/:
    get:
      operationId: courses_agentAliasesRetrieve
      description: |-
        Resolve the pseudonymous alias an MCP agent uses for a student back
        to the student (or the reverse).

        Course-scoped credentials are refused outright: the agent's own key
        must never be able to de-anonymize its own output. Only a human
        course admin, signed in normally, may look aliases up.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this course.
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: An agent alias (student-3f9a1c2d40), a student's email, or a
          bare NetID/username.
        required: true
      tags:
      - courses
      security:
      - courseKeyAuth: []
      - tokenAuth: []
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAliasLookupResponse'
          description: ''
