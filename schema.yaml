      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    VerifyRegistrationTokenResponse:
      type: object
      properties:
        isValid:
          type: boolean
        email:
          type: string
          format: email
      required:
      - isValid
    VerifyResetTokenRequest:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
