      enum:
      - always
      - on_pass
      - on_fail
      - never
      type: string
      description: |-
        * `always` - Always show
        * `on_pass` - Show when tests pass
        * `on_fail` - Show when tests fail
        * `never` - Admin only
    Webhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        event:
          type: string
          maxLength: 64
        target:
          type: string
          format: uri
          title: Target URL
          maxLength: 255
        is_active:
          type: boolean
        last_triggered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_triggered_status:
          type: string
          readOnly: true
          nullable: true
      required:
      - course
      - event
      - id
      - last_triggered_at
      - last_triggered_status
      - target
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    courseKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Course-scoped API key. Format: `CourseKey cpk_<course_id>_<secret>`'
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
