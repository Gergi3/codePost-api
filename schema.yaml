          readOnly: true
        hasOpenAttempt:
          type: boolean
          readOnly: true
        hasSubmittedAttempt:
          type: boolean
          readOnly: true
        closeAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        hasAccessCode:
          type: boolean
          readOnly: true
        myScore:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          readOnly: true
        myMaxScore:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          readOnly: true
        myPassed:
          type: boolean
          nullable: true
          readOnly: true
        myScorePending:
          type: boolean
          readOnly: true
