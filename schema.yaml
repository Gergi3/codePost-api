    Question:
      type: object
      description: |-
        A quiz question that lives in exactly one bank, with nested writable choices.

        Choices are synced atomically on create/update — a question and its options are
        authored as a unit (a multiple-choice question is meaningless without them).
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          description: The related course_id (mirrors bank.course).
        bank:
          type: integer
          description: The bank this question belongs to (exactly one).
        questionType:
          allOf:
          - $ref: '#/components/schemas/QuestionTypeEnum'
          description: |-
            The type of question.

            * `multiple_choice` - Multiple Choice (one correct)
            * `multiple_answers` - Multiple Answers (several correct)
            * `true_false` - True / False
            * `short_answer` - Short Answer
            * `essay` - Essay
            * `numerical` - Numerical
            * `code` - Code
        text:
          type: string
          description: The question stem/prompt — single font (may contain HTML from
            Canvas).
        description:
          type: string
          description: 'Optional Markdown description shown beneath the stem (rich
            content: code blocks, lists, formatting).'
        points:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Point value of the question.
        generalFeedback:
          type: string
          description: Feedback shown regardless of answer.
        partialCredit:
          type: boolean
          description: 'For multiple_answers questions: score right-minus-wrong partial
            credit ((correct − incorrect selections) / total correct × points, floored
            at 0) instead of all-or-nothing.'
        numericTolerance:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: 'For numerical questions: accept answers within ± this of an
            accepted value. Null/0 requires an exact match.'
        language:
          type: string
          nullable: true
          description: 'For code questions: the language (matches Environment.language
            values). When null, resolve from the attached assignment''s environment.'
          maxLength: 25
        starterCode:
          type: string
          nullable: true
          description: 'For code questions: optional starter code shown to students.'
        referenceSolution:
          type: string
          nullable: true
          description: 'For code questions: optional reference solution (authoring-only,
            not auto-graded).'
        source:
          allOf:
          - $ref: '#/components/schemas/QuizSourceEnum'
          readOnly: true
          description: |-
            Where this question originated (staff-internal provenance).

            * `manual` - Manually authored
            * `imported` - Imported
            * `ai` - Accepted from an AI suggestion
        createdBy:
          type: integer
          readOnly: true
          nullable: true
          description: The staff user who authored/accepted this question.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/QuestionChoice'
        metadata:
          type: string
          readOnly: true
          description: Staff-internal metadata (Canvas IDs, AI provenance). Never
            shown to students.
      required:
      - bank
      - course
      - createdBy
      - id
      - metadata
      - source
      - text
    QuestionBank:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          description: The related course_id.
        name:
          type: string
          description: The name of the question bank.
          maxLength: 128
        description:
          type: string
          description: Optional description of the bank.
        assignments:
          type: array
          items:
            type: integer
          description: Assignments this bank serves. Auto-added when the bank is used
            in a quiz attached to an assignment; editable by instructors. Used as
            AI-generation context.
        source:
          allOf:
          - $ref: '#/components/schemas/QuizSourceEnum'
          readOnly: true
          description: |-
            Where this bank originated (staff-internal provenance).

            * `manual` - Manually authored
            * `imported` - Imported
            * `ai` - Accepted from an AI suggestion
        createdBy:
          type: integer
          readOnly: true
          nullable: true
          description: The staff user who created this bank.
        questionCount:
          type: integer
          readOnly: true
      required:
      - course
      - createdBy
      - id
      - name
      - questionCount
      - source
    QuestionChoice:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
          description: The choice text (or accepted answer value).
        isCorrect:
          type: boolean
          description: Whether this choice is a correct answer.
        sortKey:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Order of this choice within the question.
        feedback:
          type: string
          description: Optional per-choice feedback.
      required:
      - text
    QuestionTypeEnum:
      enum:
      - multiple_choice
      - multiple_answers
      - true_false
      - short_answer
      - essay
      - numerical
      - code
      type: string
      description: |-
        * `multiple_choice` - Multiple Choice (one correct)
        * `multiple_answers` - Multiple Answers (several correct)
        * `true_false` - True / False
        * `short_answer` - Short Answer
        * `essay` - Essay
        * `numerical` - Numerical
        * `code` - Code
    Quiz:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
          description: The related course_id.
        assignment:
          type: integer
          nullable: true
          description: The assignment this quiz is attached to, if any.
        title:
          type: string
          description: The quiz title.
          maxLength: 128
        description:
          type: string
          description: Optional quiz description.
        assignmentTrigger:
          allOf:
          - $ref: '#/components/schemas/QuizAssignmentTriggerEnum'
          description: |-
            When an attached quiz becomes available, relative to the assignment lifecycle. Ignored for standalone quizzes.

            * `during` - During the assignment
            * `after_assignment` - After the assignment closes
            * `after_submission` - After the student submits
            * `after_feedback` - After feedback is released (whole assignment)
            * `after_student_feedback` - After each student's feedback is ready (self-paced)
        availableFrom:
          type: string
          format: date-time
          nullable: true
          description: 'Standalone quizzes: when the quiz opens.'
        availableUntil:
          type: string
          format: date-time
          nullable: true
          description: 'Standalone quizzes: when the quiz closes / is due. Also the
            close time when an attached quiz''s closeEvent is ''fixed_date''.'
        closeEvent:
          allOf:
          - $ref: '#/components/schemas/QuizCloseEventEnum'
          description: |-
            When an attached quiz closes. Ignored for standalone quizzes.

            * `none` - No automatic close
            * `assignment_due` - At the assignment's deadline
            * `submission` - After the student submits
            * `feedback_released` - When feedback is released
            * `fixed_date` - At a fixed date & time
        closeOffsetMinutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Minutes added to the close event (e.g. 10080 = one week after).
            Ignored for 'none' and 'fixed_date'.
        endAttemptsAtClose:
          type: boolean
          description: If true, reaching the close time ends/auto-submits in-progress
            attempts (hard deadline); if false it only blocks new attempts.
        accessCode:
          type: string
          readOnly: true
          nullable: true
          description: Optional code that lets a late student start this quiz after
            it has closed. Null/blank = no late access. Staff generate/rotate it via
            generateAccessCode; a correct code bypasses only the close, nothing else.
        requireSebBrowser:
          type: boolean
          description: 'If true, taking this quiz (starting, answering, submitting,
            and reading an in-progress attempt) requires Safe Exam Browser: requests
            must carry a valid X-SafeExamBrowser-ConfigKeyHash header matching sebConfigKey.'
        sebConfigKey:
          type: string
          nullable: true
          description: SEB Config Key (64 hex chars) pasted by the instructor from
            the SEB Config Tool. Requests verify as SHA256(request URL + this key).
            Null/blank with requireSebBrowser on blocks students until a key is set.
          maxLength: 64
        timeLimitMinutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Time limit in minutes. Null = untimed.
        attemptsAllowed:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Number of attempts allowed. 0 = unlimited.
        shuffleQuestions:
          type: boolean
          description: Randomize question order per attempt.
        oneQuestionAtATime:
          type: boolean
          description: 'Sequential mode: show one question at a time instead of all
            on one page.'
        allowBacktracking:
          type: boolean
          description: When sequential, whether students may return to previous questions.
        showCorrectAnswers:
          type: boolean
          description: Whether the correct-answer key is shown when a student reviews
            a submitted attempt. Reveal timing follows sealResultsUntilClose.
        sealResultsUntilClose:
          type: boolean
          description: Hold scores, per-question points, and the answer key until
            the quiz closes for the student. When false, results release as soon as
            an attempt is submitted. Stops students with attempts remaining from mining
            the key.
        showResponses:
          type: boolean
          description: Whether students may review their questions and answers after
            submitting. When false, students only see scores (per the reveal policy)
            — the question content is never shown again after submission.
        allowSubmissionReview:
          type: boolean
          description: Whether students may reopen and review a submitted attempt
            afterward. When false, submitting shows a confirmation only — the past
            attempt cannot be reopened (scores may still surface on the quiz card
            per the reveal policy).
        passingScore:
          type: number
          format: double
          maximum: 100000
          minimum: -100000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Optional pass threshold. Interpreted per passingScoreUnit (a
            percentage 0–100, or an absolute point value).
        passingScoreUnit:
          allOf:
          - $ref: '#/components/schemas/QuizPassingScoreUnitEnum'
          description: |-
            Whether passingScore is a percentage or an absolute point value.

            * `percent` - Percent
            * `points` - Points
        scoringPolicy:
          allOf:
          - $ref: '#/components/schemas/QuizScoringPolicyEnum'
          description: |-
            Which attempt counts as the official score when multiple attempts are allowed.

            * `highest` - Highest attempt counts
            * `latest` - Latest attempt counts
            * `average` - Average of attempts
        multiAttemptScoreMethod:
          allOf:
          - $ref: '#/components/schemas/QuizMultiAttemptScoreMethodEnum'
          description: |-
            How multiple attempts combine into the official score: 'by_unit' compares/averages by the passing unit (percentage, or points); 'pooled' totals points earned over total points possible across attempts.

            * `by_unit` - By passing unit (percentage, or points)
            * `pooled` - Pooled points across attempts
        isPublished:
          type: boolean
          description: If false the quiz is a draft (author-only); students only see
            published quizzes.
        gradersCanReviewGenerated:
          type: boolean
          description: If true, graders may review/edit/approve per-student generated
            question sets on this quiz; if false, only course admins may.
        gradersCanGenerate:
          type: boolean
          description: If true, graders may trigger the Generate-missing backfill
            on this quiz (generation spends AI credits), letting them generate, review,
            and release sets for their section; if false, only course admins may generate.
        autoPublishGenerated:
          type: boolean
          description: If true, per-student generated question sets are approved automatically
            on generation (no staff review gate).
        manualGeneration:
          type: boolean
          description: If true (the default), per-student question sets never generate
            automatically (no per-submission trigger, no backfill on publish or section
            creation) — staff generate via generateForStudent/generateMissing, or
            the one-time generationDate run.
        generationDate:
          type: string
          format: date-time
          nullable: true
          description: 'Manual mode only: one-time scheduled run that generates question
            sets for students who have a submission but no set yet, at/after this
            time.'
        scheduledGenerationRanAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the scheduled generationDate run last fired (one-shot
            stamp). Moving generationDate past this re-arms the run.
        generatedSections:
          type: array
          items:
            $ref: '#/components/schemas/QuizGeneratedSection'
          readOnly: true
        quizQuestions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
          readOnly: true
        questionGroups:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestionGroup'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/QuizSourceEnum'
          readOnly: true
          description: |-
            Where this quiz originated (staff-internal provenance).

            * `manual` - Manually authored
            * `imported` - Imported
            * `ai` - Accepted from an AI suggestion
        createdBy:
          type: integer
          readOnly: true
          nullable: true
          description: The staff user who created this quiz.
        metadata:
          type: string
          readOnly: true
          description: Staff-internal metadata (Canvas IDs, etc.).
      required:
      - accessCode
      - course
      - createdBy
      - generatedSections
      - id
      - metadata
      - questionGroups
