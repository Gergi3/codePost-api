        reveal/revealScore context to True.
      properties:
        id:
          type: integer
          readOnly: true
        quiz:
          type: integer
          description: The quiz being attempted.
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        attemptNumber:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          default: 1
          description: 1-based attempt index for this (quiz, student).
        status:
          allOf:
          - $ref: '#/components/schemas/QuizAttemptStatusEnum'
          description: |-
            Attempt lifecycle state.

            * `in_progress` - In progress
            * `submitted` - Submitted
        startedAt:
          type: string
          format: date-time
          description: When the student started this attempt.
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Hard stop = startedAt + quiz.timeLimitMinutes. Null when untimed.
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: When the attempt was submitted.
        score:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Auto-graded points earned (set on submit).
        maxScore:
          type: number
          format: double
          maximum: 1000000
          minimum: -1000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: Total points possible in this attempt (snapshot).
        needsManualGrading:
          type: boolean
          description: True if any response (essay/code) awaits manual grading.
        passed:
          type: boolean
          nullable: true
          description: Whether the attempt met quiz.passingScore. Null until fully
            graded or if no threshold.
        isOfficialOverride:
          type: boolean
          readOnly: true
          description: 'Staff-pinned: this attempt is the student''s official score,
            overriding the quiz''s scoringPolicy. At most one per (quiz, student).'
        oneQuestionAtATime:
          type: boolean
          readOnly: true
        allowBacktracking:
          type: boolean
          readOnly: true
        showResponses:
          type: boolean
          readOnly: true
        allowSubmissionReview:
          type: boolean
          readOnly: true
        requireSebBrowser:
          type: boolean
          readOnly: true
        serverNow:
          type: string
          format: date-time
          readOnly: true
        responses:
          type: array
          items:
            $ref: '#/components/schemas/StaffQuizResponse'
          readOnly: true
        student:
          type: string
          format: email
          title: Email address
          readOnly: true
        closeBypassed:
          type: boolean
          readOnly: true
          description: Started with the quiz access code after the close; its deadline
