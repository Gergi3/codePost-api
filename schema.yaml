    PatchedAssignment:
      type: object
      description: Assignment Serializer from which all other Assignment Serializer
        subclasses inherit from
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: The name of the assignment.
          maxLength: 32
        state:
          allOf:
          - $ref: '#/components/schemas/AssignmentStateEnum'
          description: |-
            Lifecycle state: draft -> visible -> preview -> published -> closed -> archived. Students see visible through closed, download files from preview onward, and submit only while published.

            * `draft` - Draft
            * `visible` - Visible
            * `preview` - Preview
            * `published` - Published
            * `closed` - Closed
            * `archived` - Archived
        effectiveState:
          allOf:
          - $ref: '#/components/schemas/AssignmentStateEnum'
          readOnly: true
        publishedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the assignment last entered the published state. Cleared
            if it moves back to a pre-published state (not on close/archive).
        publishAt:
          type: string
          format: date-time
          nullable: true
          description: Visible/Preview assignments auto-publish at this time (checked
            every few minutes).
        scheduledPublishRanAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the scheduled publishAt run last fired (one-shot stamp).
            Moving publishAt past this re-arms the run.
        isReleased:
          type: boolean
          readOnly: true
        feedbackStatus:
          allOf:
          - $ref: '#/components/schemas/AssignmentFeedbackStatusEnum'
          description: |-
            How grading becomes visible to students: hidden (nothing), live (as it's written), per_student (each student once their submission is finalized), released (finalized submissions, globally).

            * `hidden` - Hidden
            * `live` - Live
            * `per_student` - Per student
            * `released` - Released
        releaseFeedbackAt:
          type: string
          format: date-time
          nullable: true
          description: Hidden/per-student assignments auto-release feedback at this
            time (checked every few minutes).
        scheduledFeedbackReleaseRanAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the scheduled releaseFeedbackAt run last fired (one-shot
            stamp). Moving releaseFeedbackAt past this re-arms the run.
        feedbackReleased:
          type: boolean
          readOnly: true
        course:
          type: integer
          description: The related course_id.
        rubricCategories:
          type: array
          items:
            type: integer
          readOnly: true
        allowStudentUpload:
          type: boolean
          description: A boolean field. If true, students will be allowed to upload
            submissions until the upload due date.
        allowStudentUploadWithPartners:
          type: boolean
          description: A boolean field. If true, students will be allowed to invite
            partners to their submission.
        uploadDueDate:
          type: string
          format: date-time
          nullable: true
          description: The date after which students are not allowed to upload submissions.
            Only useful if allowStudentUpload is set to True.
        maxLateDays:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: An integer representing the maximum number of late days to
            continue to accept submissions for this assignment.
        liveFeedbackMode:
          type: boolean
          readOnly: true
        allowLateUploads:
          type: boolean
          description: A boolean field. If True and an uploadDueDate is set, students
            will still be able to submit after a deadline has passed.
        environment:
          type: integer
          readOnly: true
        files:
          type: array
          items:
            type: integer
          readOnly: true
        fileTemplates:
          type: array
          items:
            type: integer
          readOnly: true
        maxStudentTestRuns:
          type: integer
          nullable: true
          readOnly: true
        sortKey:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Optional integer to specify the order of a Course's Assignments.
        explanation:
          type: string
          description: The explanation of an assignment, visible to students.
        isVisible:
          type: boolean
          readOnly: true
        hideFrom:
          type: array
          items:
            type: integer
            title: HideFrom
          description: Sections from which to hide this assignment.
        nudgeMode:
          type: boolean
          readOnly: true
        lateDeductions:
          default: []
        studentsCanSeeGraders:
          type: boolean
          nullable: true
          description: If set, overrides course setting. If True, students can see
            graders for this assignment.
        dataSets:
          type: array
          items:
            type: integer
          readOnly: true
        points:
          type: number
          format: double
          maximum: 1000
          minimum: 0
          exclusiveMaximum: true
          description: Total points for the assignment.
        hideGrades:
          type: boolean
          description: A boolean field. If True, numeric grades are masked from students
            in any revealing feedbackStatus — they still see comments and the rubric.
        anonymousGrading:
          type: boolean
          description: A boolean field. If 'True', graders will not have access to
            the students field of submission objects, unless they have elevated privileges.
        hideGradersFromStudents:
          type: boolean
          description: A boolean field. If True, the graders of a submission will
            be hidden from students.
        commentFeedback:
          type: boolean
          description: A boolean field. If True, students can provide feedback on
            rubric comments.
        additiveGrading:
          type: boolean
          description: A boolean field. If true, grades begin at 0 (instead of assignment.points)
        allowRegradeRequests:
          type: boolean
          description: A boolean field. If True, students will be allowed to submit
            questions and regrade requests after their submission has been graded.
        regradeInstructions:
          type: string
          description: Instructions (in Markdown) to show students when they submit
            regrade requests.
        regradeDeadline:
          type: string
          format: date-time
          nullable: true
          description: The date after which students are not allowed submit a regrade
            request.
        forcedRubricMode:
          type: boolean
          description: A boolean field. If true, graders will be required to link
            a rubric comment on all comments.
        templateMode:
          type: boolean
          description: A boolean field. If true, admins will be able upload template
            code files. Those template files will be used to de-emphasize provided
            versus student-written code in submissions.
        collaborativeRubricMode:
          type: boolean
          description: A boolean field. If true, admins and graders can edit the assignment
            rubric inline in the code console.
        gradersCanEditSubmissions:
          type: boolean
          description: A boolean field. If True, graders will be allowed to edit student
            submissions (e.g. for testing fixes).
        testCategories:
          type: array
          items:
            type: integer
          readOnly: true
        showFrequentlyUsedRubricComments:
          type: boolean
          description: A boolean field. If true, an assignment's 10 most frequently
            used rubric comments will be shown within the code console.
        ai_system_prompt:
          type: string
          description: 'System prompt for AI comment generation. Placeholders: {assignment_name},
            {file_content}, {selected_content}, {rubric_context}, {grader_draft}'
        ai_summary_prompt:
          type: string
          description: 'Per-assignment override of the submission-summary system prompt.
            Placeholders: {assignment_name}, {assignment_description}, {test_results},
            {rubric}, {description_comparison}. Blank uses the global default.'
        ai_description:
          type: string
          description: AI-generated description of the assignment used as context
            for AI grading features. Editable by course admins, visible to graders.
            Not shown to students.
        ai_description_locked:
          type: boolean
          description: When True, prevents automatic regeneration of ai_description
            from new submissions.
        runFilesOnSubmit:
          type: boolean
          description: If True, submission files will be automatically executed and
            cached when a student submits.
        runTestsOnSubmit:
          type: boolean
          description: If True, autograder tests will automatically run when a student
            submits.
        testsAffectGrade:
          type: boolean
          description: If True, the results of autograder tests will be included in
            the submission grade calculation.
    PatchedAssignmentDataSetUpdate:
      type: object
      description: Serializer for updating AssignmentDataSet (without file upload)
      properties:
        name:
          type: string
          description: The name of the data set.
          maxLength: 64
        description:
          type: string
          description: Optional description of the data set.
        mountPath:
          type: string
        isActive:
          type: boolean
        isTestResource:
          type: boolean
        isStudentVariant:
          type: boolean
        autogradeAllVariants:
          type: boolean
          description: Only meaningful when is_student_variant is True. If True, the
            autograder reruns a finalized submission against every OTHER variant in
            the pool (in addition to the student's own), recording one SubmissionVariantRun
            per variant — an anti-hardcoding check. Must be set consistently across
            a pool.
    PatchedAssignmentFile:
      type: object
      description: |-
        Serializer for AssignmentFile objects.
        These are files that belong to assignments (templates, instructions, etc.).
      properties:
        name:
          type: string
          description: The name of the file.
          maxLength: 250
        data:
          type: string
          description: The data in a file. should be utf-8 encoded text.
        extension:
          type: string
          description: The extension for the file (e.g. '.java' or '.py'
          maxLength: 36
        assignment:
          type: integer
          description: The related assignment_id.
        id:
          type: integer
          readOnly: true
        path:
          type: string
          nullable: true
          description: Optional file path, delimited by slashes, to indicate a directory
            structure.
          maxLength: 500
        required:
          type: boolean
          description: If student upload is enabled, a file with this name and extension
            will be required.
        description:
          type: string
          description: Optional description shown to students.
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        hidden:
          type: boolean
          description: If True, this file will be hidden from students (but available
            for tests/helpers).
        isTestResource:
          type: boolean
    PatchedComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          description: The text on the comment
        pointDelta:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
          description: The points deducted. A negative number represents a bonus.
        startChar:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The starting character offset of the comment. For code/markdown
            files: 0-indexed character position within the start line. For PDF text-selection
            comments: character offset in the page''s text layer. For PDF region comments:
            values >= 1,000,000 encode a bounding box as MARKER + leftPct*101 + topPct
            (percentages 0-100 of page dimensions). For Jupyter notebooks (.ipynb):
            always 0 (comments target entire cells).'
        endChar:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The ending character offset of the comment. For code/markdown
            files: 0-indexed character position within the end line. For PDF text-selection
            comments: character offset in the page''s text layer. For PDF region comments:
            values >= 1,000,000 encode a bounding box as MARKER + rightPct*101 + bottomPct
            (percentages 0-100 of page dimensions). For Jupyter notebooks (.ipynb):
            always 0 (comments target entire cells).'
        startLine:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The line or position where the comment begins. For code/markdown
            files: 0-indexed line number. For PDF files: 1-based page number. For
            Jupyter notebooks (.ipynb): 0-based cell index.'
        endLine:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 'The line or position where the comment ends. For code/markdown
            files: 0-indexed line number. For PDF files: 1-based page number (usually
            same as startLine). For Jupyter notebooks (.ipynb): 0-based cell index
            (usually same as startLine).'
        file:
          type: integer
          description: The related file_id.
        rubricComment:
          type: integer
          nullable: true
          description: The related rubricComment_id. Null if no rubric comment linked.
        author:
          type: string
          format: email
          title: Email address
        feedback:
          type: integer
          readOnly: true
          description: 'Student feedback on this comment. Valid values: -1 (negative),
            0 (none), 1 (positive). Only applicable when rubricComment is set.'
        color:
          type: string
          nullable: true
          readOnly: true
        tags:
          type: array
          items:
            type: string
            description: The tag label.
            nullable: true
    PatchedCommentTemplate:
      type: object
